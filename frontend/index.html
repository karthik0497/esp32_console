<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Active-Learning Console</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-badge">ESP</div>
        <div>
          <h1>ESP32 Active-Learning Console</h1>
          <p class="subtitle">Step 1: USB Serial Connection &amp; Serial Monitor</p>
        </div>
      </div>
      <div class="header-right">
        <div id="statusBadge" class="status-badge disconnected">
          <span class="status-dot"></span>
          <span id="statusText">Disconnected</span>
        </div>
        <button id="themeToggleBtn" class="btn btn-icon btn-secondary" title="Toggle Light/Dark Theme">🌓</button>
      </div>
    </header>

    <!-- Card 1: USB Connection -->
    <section class="card">
      <div class="card-header">
        <h2>USB Serial Connection</h2>
      </div>
      <div class="form-row">
        <!-- Port Selection -->
        <div class="form-group flex-2">
          <label for="portSelect">Serial Port</label>
          <div class="input-with-button">
            <select id="portSelect" class="select-input">
              <option value="">Scanning for ports...</option>
            </select>
            <button id="refreshPortsBtn" class="btn btn-secondary" title="Scan for newly plugged ESP32 boards">
              🔄 Refresh
            </button>
          </div>
        </div>

        <!-- Baud Rate -->
        <div class="form-group flex-1">
          <label for="baudRateSelect">Baud Rate</label>
          <select id="baudRateSelect" class="select-input">
            <option value="115200" selected>115200 (MicroPython/ESP default)</option>
            <option value="9600">9600</option>
            <option value="19200">19200</option>
            <option value="38400">38400</option>
            <option value="57600">57600</option>
            <option value="74880">74880 (ESP bootloader ROM)</option>
            <option value="230400">230400</option>
            <option value="460800">460800</option>
            <option value="921600">921600</option>
          </select>
        </div>

        <!-- Connect Button -->
        <div class="form-group btn-col">
          <label>&nbsp;</label>
          <button id="connectBtn" class="btn btn-primary">Connect</button>
        </div>
      </div>

      <!-- Action Toolbar (Active when connected) -->
      <div class="action-bar">
        <span class="action-label">Quick Actions:</span>
        <button id="stopBtn" class="btn btn-sm btn-warn" disabled title="Send Ctrl+C to halt running program">
          ⏹ Stop / Ctrl+C
        </button>
        <button id="softResetBtn" class="btn btn-sm btn-secondary" disabled title="Send Ctrl+D for soft reboot into REPL">
          🔄 Soft Reset (Ctrl+D)
        </button>
        <button id="resetBtn" class="btn btn-sm btn-danger" disabled title="Pulse EN line for hard hardware restart">
          ⚡ Hard Reset (EN)
        </button>
        <button id="clearTermBtn" class="btn btn-sm btn-secondary" title="Clear terminal screen">
          🗑 Clear Terminal
        </button>
      </div>
    </section>

    <!-- Card 2: Serial Monitor -->
    <section class="card">
      <div class="card-header">
        <h2>Serial Monitor &amp; REPL</h2>
        <span id="termStatus" class="term-status">Terminal Ready</span>
      </div>

      <!-- Terminal Output Window -->
      <pre id="terminal" class="terminal-screen" tabindex="0"></pre>

      <!-- Terminal Input Form -->
      <form id="cmdForm" class="terminal-input-bar">
        <span class="prompt">&gt;&gt;&gt;</span>
        <input
          id="cmdInput"
          class="cmd-input"
          type="text"
          placeholder="Type a command or MicroPython statement (e.g. print(1+1)) and press Enter..."
          autocomplete="off"
          spellcheck="false"
          disabled
        />
        <button id="sendBtn" class="btn btn-primary" type="submit" disabled>Send</button>
      </form>
    </section>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
